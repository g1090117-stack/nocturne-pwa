<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夜間 Nocturne Bar</title>
    <style>
        /* 依據您的 gen_icons.py 參數完美調配的深夜酒吧風格 */
        body {
            background-color: #0a0a0c; /* 完美同步您的 BG 參數 */
            color: #ffdfaa;            /* 完美同步您的 BRASS_TOP 參數 */
            font-family: 'Noto Serif TC', 'Georgia', serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* 模擬您的 GLOW 參數 (245, 158, 11) 的背景圓形發光特效 */
        body::before {
            content: "";
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            padding: 20px;
            max-width: 600px;
        }

        h1 {
            font-size: 2.8rem;
            color: #c5a059; /* 完美同步您的 BRASS_MID 參數 */
            margin-bottom: 10px;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
        }

        .subtitle {
            font-size: 1.1rem;
            color: #8a6a2c; /* 完美同步您的 BRASS_BOT 參數 */
            margin-bottom: 50px;
            font-style: italic;
            letter-spacing: 1px;
        }

        .menu-section {
            border-top: 1px solid rgba(138, 106, 44, 0.3);
            border-bottom: 1px solid rgba(138, 106, 44, 0.3);
            padding: 35px 0;
            margin-bottom: 50px;
        }

        .menu-item {
            margin: 20px 0;
            font-size: 1.25rem;
            letter-spacing: 1px;
        }

        .price {
            color: #c5a059;
            margin-left: 15px;
            font-family: 'Georgia', serif;
        }

        .footer-info {
            font-size: 0.95rem;
            color: rgba(255, 223, 170, 0.5);
            line-height: 1.8;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>夜間 Nocturne Bar</h1>
        <div class="subtitle">每個靈魂，都有一杯屬於他的夜色。</div>

        <!-- 特色經典酒單 -->
        <div class="menu-section">
            <div class="menu-item">✦ 經典馬丁尼 <span class="price">$350</span></div>
            <div class="menu-item">✦ 內格羅尼 <span class="price">$380</span></div>
            <div class="menu-item">✦ 側車 Sidecar <span class="price">$400</span></div>
            <div class="menu-item">✦ 威士忌酸酒 <span class="price">$360</span></div>
        </div>

        <!-- 底部營業資訊 -->
        <div class="footer-info">
            <p>營業時間：Mon - Sun 20:00 - 02:00</p>
            <p>地址：深夜的某個沉靜角落</p>
        </div>
    </div>

</body>
</html>
